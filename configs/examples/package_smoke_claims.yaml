package:
  name: "smoke_pkg_claims"
  app_version: "0.1.11"
  config: "config.yaml"
  analysis:
    strict: true
    output_dir: "analysis/package_compare"
    plots:
      - package_pareto_frontier
    tables:
      - combined_episode_points_csv
      - package_summary_csv
      - package_summary_json
    always_include:
      - analysis_manifest_json
  claims:
    strict: false
    output_dir: "analysis/claims"
    include:
      - configs/claims/core_claims.yaml
    always_include:
      - claims_manifest_json
      - claims_report_md

jobs:
  - name: "smoke_suite"
    kind: "suite"
    mode: "simulate"
    exp_names: [baseline, no_gov]
    seeds: [0]
    episodes: 1
    steps: 5
    log_mode: "metrics_only"
    log_stride: 1
    analyze: true
    zip: false
    analysis:
      plots: []
      strict: false

  - name: "smoke_sweep"
    kind: "sweep"
    mode: "simulate"
    exp_name: "baseline"
    param_name: "sneakiness.uniform_max"
    param_min: 0.0
    param_max: 0.1
    param_n: 2
    param_scale: "linear"
    seeds: [0]
    episodes: 1
    steps: 5
    log_mode: "metrics_only"
    log_stride: 1
    analyze: true
    zip: false
    analysis:
      plots: []
      strict: false
